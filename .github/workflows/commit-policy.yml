name: Commit policy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: commit-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  SKIP_SIMPLE_GIT_HOOKS: "1"
jobs:
  commit-policy:
    name: Commit policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate branch policy
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$BASE_BRANCH" == main ]]; then
            [[ "$HEAD_BRANCH" == develop && "$HEAD_REPO" == "$BASE_REPO" ]] || {
              echo 'Pull requests into main must come from develop in this repository.' >&2
              exit 1
            }
          elif [[ "$BASE_BRANCH" == develop ]]; then
            [[ "$HEAD_BRANCH" =~ ^(feat|fix|refactor|perf|docs|test|build|ci|style|revert|chore)/([1-9][0-9]*-)?[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]] || {
              echo 'Topic branches must be named type/<issue-number>-<kebab-case>. Agent or personal prefixes are not allowed.' >&2
              exit 1
            }
          else
            echo 'Pull requests must target develop or main.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint
      - name: Validate commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Require English in title and commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          cjk='[\p{Han}\p{Hiragana}\p{Katakana}\p{Hangul}]'
          if printf '%s\n' "$PR_TITLE" | perl -CSD -ne "exit 1 if /$cjk/"; then :; else
            echo 'The pull request title must be written in English. See CONTRIBUTING.md#language-policy.' >&2
            exit 1
          fi
          if git log --format=%B "$BASE_SHA..$HEAD_SHA" | perl -CSD -ne "exit 1 if /$cjk/"; then :; else
            echo 'Commit messages must be written in English. See CONTRIBUTING.md#language-policy.' >&2
            exit 1
          fi
